<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>みつけてください</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="res/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Tegomin&display=swap" rel="stylesheet">
  </head>
  <body>
    <h1>みつけてください</h1>
    <p>
      こんにちは。みつけてくれてありがとうございます。これはテスト用のページです。
    </p>
    <div class="content-area">
        <div id="message-area">
            <p id="message-text">
                ご挨拶です。私はここにいます。差し支えなければ、あなたのお名前を教えていただけますか？
            </p>
        </div>
        <div id="input-area">
            <input id="user-input" class="user-input" type="text" value="匿名" maxlength="100">
            <button id="submit-button" type="button">送信</button>
        </div>
        <div id="description-area">
            <p>
                これはテスト用のページです。<br>
                具体的には、なんか話すと答えてくれるものです。<br>
                なにかあれば、こちらまで。
            </p>
        </div>
    </div>
    <div id="mordal" hidden></div>
    <script src="script.js"></script>
  </body>
</html>
