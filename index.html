<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>みつけてください</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="res/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Hachi+Maru+Pop&family=IBM+Plex+Sans+JP&family=Shippori+Mincho&family=Yomogi&family=Zen+Old+Mincho&family=New+Tegomin&display=swap" rel="stylesheet">
  </head>
  <body>
    <h1>みつけてください</h1>
    <div class="content-area">
        <div id="message-area" class="message-area">
            <p id="message-text" class="message-item">
                こんにちは。私はここにいます。<br>
                差し支えなければ、あなたのお名前を教えていただけますか？
            </p>
        </div>
        <div id="input-area" class="input-area">
            <input id="user-input" class="user-input" type="text" value="匿名" maxlength="100">
            <button id="submit-button" type="button" disabled>送信</button>
        </div>
        <div id="description-area" class="description-area">
            <p class="content">
                これはテスト用のページです。
            </p>
        </div>
    </div>
    <div id="modal" hidden></div>
    <script src="script.js"></script>
  </body>
</html>
